services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: admin_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 10

  users:
    build: ./users
    environment:
      DATABASE_URL: postgresql://users_svc:users_pw@db:5432/users_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  orders:
    build: ./orders
    environment:
      DATABASE_URL: postgresql://orders_svc:orders_pw@db:5432/orders_db
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: